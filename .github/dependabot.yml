version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    assignees:
      - "rogierlommers"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "rogierlommers"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    assignees:
      - "rogierlommers"
    schedule:
      interval: "weekly"
